# SensOS chrony configuration for field devices.
# Prefer public pool servers when connectivity exists, keep RTC in sync when present,
# and tolerate long offline periods without trying to serve time to others.

pool pool.ntp.org iburst

# GPS time via gpsd's shared-memory feed (unit 0 = NMEA-derived time, no PPS
# wiring on this fleet's hardware, so precision is set accordingly --
# roughly 100ms, dominated by serial/sentence-parse latency rather than
# satellite accuracy). Deliberately not "noselect": a field device with no
# general internet route has nothing else to sync from, and chrony's own
# source-selection already prefers pool.ntp.org when it's reachable (lower
# jitter, tighter precision) without needing an explicit priority here --
# GPS becomes the fallback purely because chrony trusts the better source
# when more than one is available. Requires gpsd running with -n (see
# config-gps --backend serial) so it feeds SHM continuously, not only while
# a client is connected.
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

# Step the clock quickly on early startup if the offset is large.
makestep 1.0 3

# Record drift so the clock behaves reasonably while offline.
driftfile /var/lib/chrony/chrony.drift

# Persist measurements and RTC tracking across reboots.
dumpdir /var/lib/chrony
ntsdumpdir /var/lib/chrony
rtcsync

# Log basic tracking information for troubleshooting.
logdir /var/log/chrony
log tracking measurements statistics

# Act only as a client.
port 0
cmdport 0

# Ignore sources that look implausible.
maxupdateskew 100.0
